# Every service starts by default:
#   docker compose up -d                              # the whole stack, one machine
#
# To run only part of it, name the services you want. Each one is a single role,
# and depends_on pulls in what it genuinely cannot live without:
#   docker compose up -d scrobble_vault               # vault + its database
#   docker compose up -d front_end                    # the ui only
#   docker compose up -d last_llm_mcp last_llm_api    # the llm services only
#
# Nothing starts a service on another machine for you: front_end, last_llm_mcp and
# last_llm_api all reach the vault by address, so a split setup is just a matter of
# running different services on each box and pointing the addresses at each other.
#
# SECURITY: the services have no authentication, so published ports bind to
# 127.0.0.1 by default. To reach a service from another machine, set the
# *_BIND_IP variables to a trusted interface (e.g. a VPN address) — never a
# public one.
services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: scrobble_vault_DB
    restart: always
    # Defaults so a fresh clone starts with no .env at all. The DB port binds to
    # 127.0.0.1 and only scrobble_vault reaches it over the compose network, so
    # the default passwords are not exposed. Override them in .env before setting
    # POSTGRES_BIND_IP to anything else.
    environment: # env for DB initalization
      - POSTGRES_DB=${POSTGRES_DB:-scrobble_vault}
      - POSTGRES_USER=${POSTGRES_SUPER_USER:-admin} # the container needs this specific variable for the superuser
      - POSTGRES_PASSWORD=${POSTGRES_SUPER_USER_PASSWORD:-scrobble_vault_admin} # the container needs this specific variable for the superuser
      - POSTGRES_SUPER_USER=${POSTGRES_SUPER_USER:-admin}
      - POSTGRES_SUPER_USER_PASSWORD=${POSTGRES_SUPER_USER_PASSWORD:-scrobble_vault_admin}
      - POSTGRES_READ_ONLY_USER=${POSTGRES_READ_ONLY_USER:-readonly}
      - POSTGRES_READ_ONLY_USER_PASSWORD=${POSTGRES_READ_ONLY_USER_PASSWORD:-scrobble_vault_readonly}
    ports:
      # Host-side access for debugging with psql; scrobble_vault reaches the DB
      # over the compose network, so this mapping is not needed for the app.
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persistant storage
      - scrobble_vault_DB_data:/var/lib/postgresql/
      # relative_host_path:container_path:read_only_permission, to create read only user on first run.
      - ./backend/scrobble_vault/init_read_only_user.sh:/docker-entrypoint-initdb.d/init_read_only_user.sh:ro
    healthcheck:
      # Without this scrobble_vault crash-loops racing Postgres startup.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPER_USER:-admin} -d ${POSTGRES_DB:-scrobble_vault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scrobble_vault:
    build:
      context: ./backend
      dockerfile: scrobble_vault/Dockerfile
    container_name: scrobble_vault
    restart: unless-stopped
    env_file:
      - path: .env
        required: false # a fresh clone has no .env, everything below has a default
    environment:
      - POSTGRES_HOST=db # override .env's localhost: inside the compose network the DB is reached by service name
      - SETTINGS_FILE=/data/settings.json # settings page edits, on a volume so they outlive the container
      # Must match the db service's defaults above, or the vault cannot connect
      - POSTGRES_DB=${POSTGRES_DB:-scrobble_vault}
      - POSTGRES_SUPER_USER=${POSTGRES_SUPER_USER:-admin}
      - POSTGRES_SUPER_USER_PASSWORD=${POSTGRES_SUPER_USER_PASSWORD:-scrobble_vault_admin}
      - POSTGRES_READ_ONLY_USER=${POSTGRES_READ_ONLY_USER:-readonly}
      - POSTGRES_READ_ONLY_USER_PASSWORD=${POSTGRES_READ_ONLY_USER_PASSWORD:-scrobble_vault_readonly}
    ports:
      - "${SCROBBLE_VAULT_BIND_IP:-127.0.0.1}:${SCROBBLE_VAULT_PORT:-8000}:${SCROBBLE_VAULT_PORT:-8000}"
    volumes:
      # Cache the sentence-transformers model download across container recreations
      - hugging_face_cache:/root/.cache/huggingface
      # Settings page overrides. A volume, not the image, so --force-recreate and
      # rebuilds keep them. They win over .env, see backend/scrobble_vault/env.py
      - vault_settings:/data
    depends_on:
      db:
        condition: service_healthy

  front_end:
    build:
      context: ./front-end
    container_name: front_end
    restart: unless-stopped
    # Host networking so SCROBBLE_VAULT_IPV4 keeps its normal meaning — the
    # vault's address as seen from this machine (127.0.0.1 when local, another
    # host's address when remote). On a bridge network 127.0.0.1 would point at
    # the container itself and break the local case.
    network_mode: host
    environment:
      # The summary page's server-side load reads these at runtime ($env/dynamic).
      - SCROBBLE_VAULT_IPV4=${SCROBBLE_VAULT_IPV4:-127.0.0.1}
      - SCROBBLE_VAULT_PORT=${SCROBBLE_VAULT_PORT:-8000}
      - PORT=${FRONTEND_PORT:-3000}
      # The chat proxy route reads these at runtime too. Host networking gives
      # LAST_LLM_API_IPV4 the same meaning as SCROBBLE_VAULT_IPV4: the chat api
      # as seen from this machine.
      - LAST_LLM_API_IPV4=${LAST_LLM_API_IPV4:-127.0.0.1}
      - LAST_LLM_API_PORT=${LAST_LLM_API_PORT:-8002}
      # The settings page proxies to both services with this, it never reaches
      # the browser. Unset is fine on a default install where everything binds to
      # 127.0.0.1, set one before pointing any *_BIND_IP at a VPN address.
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}

  last_llm_mcp:
    build:
      context: ./backend
      dockerfile: last_llm_service/Dockerfile
    container_name: last_llm_mcp
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Override .env's localhost: inside the compose network the vault is reached by
      # service name. Set SCROBBLE_VAULT_URL_DOCKER when the vault is on another machine.
      - SCROBBLE_VAULT_URL=${SCROBBLE_VAULT_URL_DOCKER:-http://scrobble_vault:8000}
      - SETTINGS_FILE=/data/settings.json
    ports:
      - "${LAST_LLM_MCP_BIND_IP:-127.0.0.1}:${LAST_LLM_MCP_PORT:-8001}:${LAST_LLM_MCP_PORT:-8001}"
    volumes:
      # Same volume as last_llm_api on purpose: only the api serves /settings, mcp
      # picks an edit up off the shared file within a second (settings_store.py)
      - llm_settings:/data
    command: ["python", "-m", "last_llm_service.main", "mcp", "--transport", "http"]
    # No depends_on: a role does not start its remote dependencies, the vault
    # may live on another machine entirely (ADR-4)

  last_llm_api:
    build:
      context: ./backend
      dockerfile: last_llm_service/Dockerfile
    container_name: last_llm_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - SCROBBLE_VAULT_URL=${SCROBBLE_VAULT_URL_DOCKER:-http://scrobble_vault:8000}
      - SETTINGS_FILE=/data/settings.json
    ports:
      - "${LAST_LLM_API_BIND_IP:-127.0.0.1}:${LAST_LLM_API_PORT:-8002}:${LAST_LLM_API_PORT:-8002}"
    volumes:
      - llm_settings:/data
    command: ["python", "-m", "last_llm_service.main", "api"]

volumes:
  scrobble_vault_DB_data:
  hugging_face_cache:
  vault_settings:
  llm_settings:
