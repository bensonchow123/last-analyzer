<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Last-analyser">
  <defs>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <!-- keeps the chart inside the record however the bars are tuned -->
    <clipPath id="inside">
      <circle cx="64" cy="64" r="53"/>
    </clipPath>
  </defs>

  <!-- the record -->
  <circle cx="64" cy="64" r="56" fill="#17171a" stroke="#8b5cf6" stroke-width="5"/>

  <!-- grooves, stopping where the chart takes over -->
  <g fill="none" stroke="#8b5cf6" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
    <path d="M22 72a42 42 0 1 1 84 0"/>
    <path d="M35 72a29 29 0 1 1 58 0"/>
  </g>

  <!-- label and spindle, dead centre like a real record -->
  <circle cx="64" cy="64" r="14" fill="#8b5cf6"/>
  <circle cx="64" cy="64" r="4.5" fill="#17171a"/>

  <!-- listening history, growing out of the bottom grooves -->
  <g fill="url(#bars)" clip-path="url(#inside)">
    <rect x="31" y="88" width="11" height="20" rx="4"/>
    <rect x="45" y="82" width="11" height="26" rx="4"/>
    <rect x="59" y="86" width="11" height="22" rx="4"/>
    <rect x="73" y="79" width="11" height="29" rx="4"/>
    <rect x="87" y="90" width="11" height="18" rx="4"/>
  </g>
</svg>
